[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaappu"
version = "0.2.0"
description = "Classical Tamil prosody: Kural Venba meter checker (asai, seer, venthalai), Mozhimarapu phonotactics, and meter-constrained decoding"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chandrasekar R" }]
requires-python = ">=3.9"
keywords = ["tamil", "prosody", "thirukkural", "venba", "meter", "poetry"]
classifiers = ["Programming Language :: Python :: 3", "Natural Language :: Tamil", "Topic :: Text Processing :: Linguistic"]
dependencies = []

[project.optional-dependencies]
decode = ["torch", "transformers>=4.40"]
test = ["pytest"]

[project.urls]
Homepage = "https://yaappu.rclabs.in"
Repository = "https://github.com/chandrasekar-r/yaappu"

[tool.setuptools]
packages = ["yaappu"]

[tool.setuptools.package-data]
yaappu = ["data/*.json"]
